<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>サバイバル避けゲーム - アイテム追加版</title>
    <style>
        * {
            user-select: none;
            touch-action: none;
        }

        body {
            background: linear-gradient(145deg, #0a0a1a 0%, #000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .game-container {
            background: #000;
            border-radius: 32px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 0 2px #ff44ff33;
            cursor: none;
            width: 100%;
            height: auto;
            background: #0a0a2a;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            margin-bottom: 12px;
            background: #1a1a2eaa;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            color: #fff;
            flex-wrap: wrap;
            gap: 8px;
        }

        .score-box, .time-box, .effect-box {
            text-align: center;
            min-width: 70px;
        }

        .score-label, .time-label, .effect-label {
            font-size: 0.6rem;
            color: #aaa;
        }

        .score-value, .time-value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .score-value { color: #ffaa44; }
        .time-value { color: #88ffaa; }
        .effect-value {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ff88ff;
        }

        .reset-btn {
            background: #2a1a3a;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: #ffddff;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .instruction {
            text-align: center;
            margin-top: 12px;
            font-size: 0.6rem;
            color: #888;
            padding: 0 8px;
        }

        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="info-panel">
            <div class="score-box">
                <div class="score-label">💀 倒した敵</div>
                <div class="score-value" id="killCount">0</div>
            </div>
            <div class="time-box">
                <div class="time-label">⏱️ 生存時間</div>
                <div class="time-value" id="timeScore">0.0</div>
            </div>
            <div class="effect-box">
                <div class="effect-label">✨ 効果</div>
                <div class="effect-value" id="effectStatus">-</div>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 リセット</button>
        </div>
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        <div class="instruction">
            👆 長押し＋スワイプで移動（指を離すと停止）<br>
            🌈 虹アイテム:敵全消滅 &nbsp;|&nbsp; ⭐ 金アイテム:敵減速 &nbsp;|&nbsp; 💎 点滅アイテム:無敵
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const killCountSpan = document.getElementById('killCount');
    const timeScoreSpan = document.getElementById('timeScore');
    const effectStatusSpan = document.getElementById('effectStatus');
    
    let canvasWidth = 500;
    let canvasHeight = 500;
    
    function setCanvasSize() {
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
    }
    setCanvasSize();
    
    // ----- ゲーム変数 -----
    let player = { x: canvasWidth/2, y: canvasHeight/2, radius: 14 };
    let enemies = [];
    let gameOver = false;
    let killCount = 0;
    let startTime = null;
    let currentTime = 0;
    
    // アイテム関連
    let items = [];
    
    // アイテム出現フラグ（リセット対応）
    let lastRainbowSpawn = 0;
    let lastGoldSpawn = 0;
    let lastBlinkSpawn = 0;
    
    // 効果関連
    let slowActive = false;
    let slowEndTime = 0;
    let invincibleActive = false;
    let invincibleEndTime = 0;
    let currentEnemySpeedMulti = 1.0;
    
    // 操作関連
    let isDragging = false;
    
    // 敵スポーン
    let spawnCounter = 0;
    let baseSpawnDelay = 40;
    
    // ----- ゲームリセット -----
    function resetGame() {
        gameOver = false;
        killCount = 0;
        enemies = [];
        items = [];
        player.x = canvasWidth/2;
        player.y = canvasHeight/2;
        startTime = performance.now();
        currentTime = 0;
        spawnCounter = 10;
        
        slowActive = false;
        invincibleActive = false;
        currentEnemySpeedMulti = 1.0;
        
        // アイテム出現時刻リセット（重要！）
        lastRainbowSpawn = 0;
        lastGoldSpawn = 0;
        lastBlinkSpawn = 0;
        
        updateUI();
        effectStatusSpan.textContent = '-';
    }
    
    function updateUI() {
        killCountSpan.textContent = killCount;
        if (!gameOver && startTime) {
            const elapsed = (performance.now() - startTime) / 1000;
            timeScoreSpan.textContent = elapsed.toFixed(1);
        } else {
            timeScoreSpan.textContent = currentTime.toFixed(1);
        }
        
        // 効果表示
        const nowSec = performance.now() / 1000;
        if (invincibleActive && invincibleEndTime > nowSec) {
            const remaining = Math.max(0, (invincibleEndTime - nowSec)).toFixed(1);
            effectStatusSpan.textContent = `🛡️ 無敵 ${remaining}s`;
        } else if (slowActive && slowEndTime > nowSec) {
            const remaining = Math.max(0, (slowEndTime - nowSec)).toFixed(1);
            effectStatusSpan.textContent = `🐢 減速 ${remaining}s`;
        } else {
            if (invincibleActive) invincibleActive = false;
            if (slowActive) slowActive = false;
            effectStatusSpan.textContent = '-';
        }
    }
    
    // ----- 敵のスポーン -----
    function spawnEnemy() {
        if (gameOver) return;
        let side = Math.floor(Math.random() * 4);
        let x, y;
        const pad = 15;
        if (side === 0) { x = -pad; y = Math.random() * canvasHeight; }
        else if (side === 1) { x = canvasWidth + pad; y = Math.random() * canvasHeight; }
        else if (side === 2) { x = Math.random() * canvasWidth; y = -pad; }
        else { x = Math.random() * canvasWidth; y = canvasHeight + pad; }
        
        let speed = (0.7 + Math.random() * 0.6) * currentEnemySpeedMulti;
        enemies.push({ x, y, radius: 11, vx: 0, vy: 0, speed: speed, baseSpeed: speed });
    }
    
    // ----- アイテムスポーン（修正: 猶予期間を設けて確実に出現）-----
    function trySpawnItem(nowSec) {
        if (gameOver) return;
        
        // 虹アイテム: 15秒ごと (開始後2秒から)
        if (nowSec >= 2.0 && lastRainbowSpawn + 15 <= nowSec) {
            lastRainbowSpawn = nowSec;
            spawnItemAtRandom('rainbow');
        }
        // 金アイテム: 20秒ごと
        if (nowSec >= 3.0 && lastGoldSpawn + 20 <= nowSec) {
            lastGoldSpawn = nowSec;
            spawnItemAtRandom('gold');
        }
        // 点滅アイテム: 70秒ごと
        if (nowSec >= 5.0 && lastBlinkSpawn + 70 <= nowSec) {
            lastBlinkSpawn = nowSec;
            spawnItemAtRandom('blink');
        }
    }
    
    function spawnItemAtRandom(type) {
        if (gameOver) return;
        const margin = 40;
        const x = margin + Math.random() * (canvasWidth - margin * 2);
        const y = margin + Math.random() * (canvasHeight - margin * 2);
        items.push({ x, y, radius: 12, type: type });
    }
    
    // ----- アイテム取得効果 -----
    function applyItemEffect(type) {
        const nowSec = performance.now() / 1000;
        if (type === 'rainbow') {
            enemies = [];
            killCount += 999;
            updateUI();
        } else if (type === 'gold') {
            slowActive = true;
            slowEndTime = nowSec + 5;
            currentEnemySpeedMulti = 0.5;
            for (let e of enemies) {
                e.speed = e.baseSpeed * currentEnemySpeedMulti;
            }
        } else if (type === 'blink') {
            invincibleActive = true;
            invincibleEndTime = nowSec + 10;
        }
        updateUI();
    }
    
    // ----- アイテム衝突判定 -----
    function checkItemCollisions() {
        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const dx = player.x - item.x;
            const dy = player.y - item.y;
            if (Math.hypot(dx, dy) < player.radius + item.radius) {
                applyItemEffect(item.type);
                items.splice(i, 1);
                i--;
            }
        }
    }
    
    // ----- 敵の移動 -----
    function updateEnemiesDirection() {
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            const len = Math.hypot(dx, dy);
            if (len > 0.01) {
                const move = e.speed;
                e.vx = (dx / len) * move;
                e.vy = (dy / len) * move;
            }
            e.x += e.vx;
            e.y += e.vy;
        }
        // 画面外削除
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (e.x < -150 || e.x > canvasWidth + 150 || e.y < -150 || e.y > canvasHeight + 150) {
                enemies.splice(i,1);
                i--;
            }
        }
    }
    
    // ----- 衝突判定（無敵なら無視）-----
    function checkCollisions() {
        if (invincibleActive) return false;
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            if (Math.hypot(dx, dy) < player.radius + e.radius) {
                gameOver = true;
                currentTime = (performance.now() - startTime) / 1000;
                updateUI();
                return true;
            }
        }
        return false;
    }
    
    // ----- 敵の出現頻度 -----
    function updateSpawnRate() {
        if (gameOver) return 35;
        const elapsed = (performance.now() - startTime) / 1000;
        let delay = Math.max(22, baseSpawnDelay - Math.floor(elapsed / 2.2));
        return delay;
    }
    
    // ----- 操作（長押し＋スワイプ）-----
    function setupControls() {
        const getCanvasCoords = (clientX, clientY) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvasWidth / rect.width;
            const scaleY = canvasHeight / rect.height;
            let x = (clientX - rect.left) * scaleX;
            let y = (clientY - rect.top) * scaleY;
            x = Math.min(canvasWidth - player.radius, Math.max(player.radius, x));
            y = Math.min(canvasHeight - player.radius, Math.max(player.radius, y));
            return { x, y };
        };
        
        const onStart = (e) => {
            e.preventDefault();
            if (gameOver) { resetGame(); return; }
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pos = getCanvasCoords(clientX, clientY);
            player.x = pos.x; player.y = pos.y;
        };
        
        const onMove = (e) => {
            if (!isDragging || gameOver) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pos = getCanvasCoords(clientX, clientY);
            player.x = pos.x; player.y = pos.y;
        };
        
        const onEnd = () => { isDragging = false; };
        
        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        canvas.addEventListener('touchend', onEnd);
        canvas.addEventListener('touchcancel', onEnd);
        canvas.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
    }
    
    // ----- ゲーム更新 -----
    function updateGame() {
        if (gameOver) return;
        
        const nowSec = (performance.now() - startTime) / 1000;
        
        // アイテム出現チェック（毎フレーム実行で確実に）
        trySpawnItem(nowSec);
        
        // 敵スポーン
        if (spawnCounter <= 0) {
            spawnEnemy();
            const newDelay = updateSpawnRate();
            spawnCounter = Math.floor(newDelay);
        } else {
            spawnCounter--;
        }
        
        updateEnemiesDirection();
        checkItemCollisions();
        checkCollisions();
        
        // 減速効果の終了チェック
        const now = performance.now() / 1000;
        if (slowActive && slowEndTime <= now) {
            slowActive = false;
            currentEnemySpeedMulti = 1.0;
            for (let e of enemies) {
                e.speed = e.baseSpeed;
            }
        }
        if (invincibleActive && invincibleEndTime <= now) {
            invincibleActive = false;
        }
        
        if (!gameOver) updateUI();
    }
    
    // ----- 描画 -----
    function draw() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        
        // 星
        ctx.fillStyle = '#ffffff30';
        for (let i = 0; i < 120; i++) {
            ctx.fillRect((i*173)%canvasWidth, (Date.now()*0.1 + i*97)%canvasHeight, 1.5, 1.5);
        }
        
        // 敵
        for (let e of enemies) {
            const grad = ctx.createRadialGradient(e.x-3, e.y-3, 3, e.x, e.y, e.radius);
            grad.addColorStop(0, '#f66');
            grad.addColorStop(1, '#a0a');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius-1, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(e.x-3, e.y-3, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(e.x-4, e.y-4, 1.5, 0, Math.PI*2);
            ctx.fill();
        }
        
        // アイテム
        for (let item of items) {
            if (item.type === 'rainbow') {
                const grad = ctx.createLinearGradient(item.x-8, item.y-8, item.x+8, item.y+8);
                grad.addColorStop(0, 'red'); grad.addColorStop(0.2, 'orange'); grad.addColorStop(0.4, 'yellow');
                grad.addColorStop(0.6, 'green'); grad.addColorStop(0.8, 'blue'); grad.addColorStop(1, 'purple');
                ctx.fillStyle = grad;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#fff';
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius-2, 0, Math.PI*2);
                ctx.fill();
            } else if (item.type === 'gold') {
                ctx.fillStyle = '#ffcc44';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffaa00';
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius-2, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#ffaa22';
                ctx.beginPath();
                ctx.arc(item.x-2, item.y-2, 3, 0, Math.PI*2);
                ctx.fill();
            } else if (item.type === 'blink') {
                const blink = Math.sin(Date.now() * 0.015) > 0;
                ctx.fillStyle = blink ? '#ffffff' : '#aaaaff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0af';
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius-2, 0, Math.PI*2);
                ctx.fill();
            }
        }
        ctx.shadowBlur = 0;
        
        // 自機
        ctx.shadowBlur = 10;
        ctx.shadowColor = invincibleActive ? '#fff' : '#0af';
        ctx.fillStyle = invincibleActive ? '#fff' : '#4cf';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius-2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#8ef';
        ctx.beginPath();
        ctx.arc(player.x-2, player.y-2, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(player.x-3, player.y-3, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // 無敵シールド
        if (invincibleActive) {
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius+6, 0, Math.PI*2);
            ctx.fillStyle = '#ffffff30';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius+10, 0, Math.PI*2);
            ctx.fillStyle = '#88aaff30';
            ctx.fill();
        }
        
        // ゲームオーバー
        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 26px "Segoe UI"';
            ctx.fillText('GAME OVER', canvasWidth/2-95, canvasHeight/2-40);
            ctx.font = '14px monospace';
            ctx.fillStyle = '#ffaa66';
            ctx.fillText('リセットボタン or 画面タップ', canvasWidth/2-130, canvasHeight/2+30);
            ctx.font = '13px monospace';
            ctx.fillStyle = '#aaa';
            ctx.fillText(`生存 ${currentTime.toFixed(1)} 秒`, canvasWidth/2-65, canvasHeight/2+80);
        }
        
        // ドラッグ中エフェクト
        if (isDragging && !gameOver) {
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius+6, 0, Math.PI*2);
            ctx.fillStyle = '#ffffff40';
            ctx.fill();
        }
    }
    
    function gameLoop() {
        updateGame();
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    document.getElementById('resetBtn').addEventListener('click', () => resetGame());
    document.getElementById('resetBtn').addEventListener('touchstart', (e) => { e.preventDefault(); resetGame(); });
    
    function init() {
        resetGame();
        setupControls();
        gameLoop();
    }
    init();
</script>
</body>
</html>
