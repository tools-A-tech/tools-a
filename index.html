<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STG - 弾幕シューティング</title>
    <style>
        * { user-select: none; touch-action: none; }
        body {
            background: linear-gradient(145deg, #0a0a1a 0%, #000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
            margin: 0;
            padding: 16px;
        }
        .game-container {
            background: #000;
            border-radius: 32px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: 0 0 0 2px #ff44ff33;
            background: #050510;
            cursor: none;
            width: 100%;
            height: auto;
            touch-action: none;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 8px 16px;
            margin-bottom: 8px;
            background: #1a1a2eaa;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            color: #fff;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 8px;
        }
        .score-area, .lives-area, .highscore-area {
            background: #00000066;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .score-label, .lives-label, .highscore-label { font-size: 0.7rem; color: #aaa; }
        .score-value, .lives-value, .highscore-value { font-size: 1.2rem; font-weight: bold; }
        .score-value { color: #ffaa44; }
        .lives-value { color: #ff6666; }
        .highscore-value { color: #88ffaa; }
        .reset-btn {
            background: #2a1a3a;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffddff;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .instruction {
            text-align: center;
            margin-top: 12px;
            font-size: 0.65rem;
            color: #aaa;
            padding: 8px;
            background: #1a1a2e55;
            border-radius: 40px;
        }
        .instruction span {
            display: inline-block;
            padding: 4px 12px;
            margin: 0 4px;
            background: #2a1a3a;
            border-radius: 30px;
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="info-panel">
            <div class="score-area"><div class="score-label">🎯 SCORE</div><div class="score-value" id="scoreValue">0</div></div>
            <div class="lives-area"><div class="lives-label">✈️ 残機</div><div class="lives-value" id="livesValue">5</div></div>
            <div class="highscore-area"><div class="highscore-label">🏆 HIGH SCORE</div><div class="highscore-value" id="highscoreValue">0</div></div>
            <button class="reset-btn" id="resetBtn">🔄 RESET</button>
        </div>
        <canvas id="gameCanvas" width="500" height="600"></canvas>
        <div class="instruction">
            🎮 画面を<span>長押し＋スワイプ</span>で移動（指を離すと停止）
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const LOGIC_WIDTH = 500;
    const LOGIC_HEIGHT = 600;
    canvas.width = LOGIC_WIDTH;
    canvas.height = LOGIC_HEIGHT;
    
    // ----- 自機 -----
    let player = { x: LOGIC_WIDTH/2, y: 520, radius: 6 };
    let playerLives = 5;
    let score = 0;
    let highscore = localStorage.getItem('stg_highscore') ? parseInt(localStorage.getItem('stg_highscore')) : 0;
    let gameOver = false;
    let gameClear = false;
    let currentStage = 1;
    let invincibleFrames = 0;
    
    let playerBullets = [];
    let enemyBullets = [];
    let enemies = [];
    
    let boss = null;
    let bossHits = 0;
    let bossMaxHits = 100;
    let bossPhase = 0;
    let bossMoveDirection = 1;
    
    // 3面ボス専用
    let bossSpecialPhase = 0;
    let cornerBullets = [];
    let spiralTimer = 0;
    
    let gameTimer = 0;
    let stageStartTime = 0;
    let enemySpawnTimer = 0;
    let shotCooldown = 0;
    
    let isTouching = false;
    let touchMoveTargetX = null;
    
    const scoreSpan = document.getElementById('scoreValue');
    const livesSpan = document.getElementById('livesValue');
    const highscoreSpan = document.getElementById('highscoreValue');
    
    const bossEmojis = { 1: '😠', 2: '😡', 3: '🤗' };
    
    function updateUI() {
        scoreSpan.textContent = score;
        livesSpan.textContent = playerLives;
        if (score > highscore) {
            highscore = score;
            localStorage.setItem('stg_highscore', highscore);
            highscoreSpan.textContent = highscore;
        }
    }
    
    function resetGame() {
        gameOver = false;
        gameClear = false;
        playerLives = 5;
        score = 0;
        currentStage = 1;
        player.x = LOGIC_WIDTH/2;
        invincibleFrames = 0;
        playerBullets = [];
        enemyBullets = [];
        enemies = [];
        boss = null;
        bossHits = 0;
        bossPhase = 0;
        bossSpecialPhase = 0;
        cornerBullets = [];
        spiralTimer = 0;
        gameTimer = 0;
        enemySpawnTimer = 10;
        stageStartTime = performance.now() / 1000;
        updateUI();
    }
    
    function shoot() {
        if (gameOver || gameClear) return;
        playerBullets.push({ x: player.x - 5, y: player.y - 15, vx: 0, vy: -8, size: 5, color: '#88ccff' });
        playerBullets.push({ x: player.x - 12, y: player.y - 10, vx: -2.2, vy: -7, size: 5, color: '#88ccff' });
        playerBullets.push({ x: player.x - 5, y: player.y - 10, vx: 0, vy: -8, size: 5, color: '#88ccff' });
        playerBullets.push({ x: player.x + 2, y: player.y - 10, vx: 2.2, vy: -7, size: 5, color: '#88ccff' });
    }
    
    function spawnEnemy() {
        if (gameOver || gameClear || boss || gameTimer > 15) return;
        const x = 20 + Math.random() * (LOGIC_WIDTH - 70);
        enemies.push({ x: x, y: -40, w: 32, h: 32, shotTimer: 0 });
    }
    
    function spawnBoss() {
        boss = {
            x: LOGIC_WIDTH/2 - 35,
            y: -80,
            targetY: 40,
            w: 70, h: 70,
            emoji: bossEmojis[currentStage],
            pattern: currentStage,
            speed: 2.0,
            shootDelay: 20,
            shootTimer: 0,
            moveDir: 1
        };
        bossHits = 0;
        bossPhase = 1;
        bossSpecialPhase = 0;
        cornerBullets = [];
        spiralTimer = 0;
    }
    
    // 1面ボスの弾幕（サイズ大きめ・速度2）
    function stage1BossShoot() {
        const centerX = boss.x + boss.w/2;
        const centerY = boss.y + boss.h/2;
        for (let i = -2; i <= 2; i++) {
            const angle = Math.PI/2 + (i * 0.25);
            enemyBullets.push({ 
                x: centerX, y: centerY, 
                vx: Math.cos(angle) * 2.0, 
                vy: Math.sin(angle) * 2.0, 
                size: 8, color: '#ff8888', life: 300 
            });
        }
    }
    
    // 通常ボスの弾幕（1,2面用）
    function normalBossShoot() {
        const shootX = boss.x + boss.w/2;
        const shootY = boss.y + boss.h/2;
        
        if (boss.pattern === 1) {
            for (let i = -2; i <= 2; i++) {
                const angle = Math.PI/2 + (i * 0.25);
                enemyBullets.push({ x: shootX, y: shootY, vx: Math.cos(angle) * 3.5, vy: Math.sin(angle) * 3.5, size: 6, color: '#ff6666' });
            }
        } else {
            for (let i = -3; i <= 3; i++) {
                const angle = Math.PI/2 + (i * 0.3);
                enemyBullets.push({ x: shootX, y: shootY, vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4, size: 6, color: '#ff6666' });
            }
            const dx = player.x - shootX;
            const dy = player.y - shootY;
            const angle = Math.atan2(dy, dx);
            enemyBullets.push({ x: shootX, y: shootY, vx: Math.cos(angle) * 4.5, vy: Math.sin(angle) * 4.5, size: 6, color: '#ff8888' });
        }
    }
    
    // 角に向かって発射
    function fireCornerShots() {
        const corners = [{ x: 40, y: 40 }, { x: LOGIC_WIDTH - 40, y: 40 }];
        for (let corner of corners) {
            const dx = corner.x - (boss.x + boss.w/2);
            const dy = corner.y - (boss.y + boss.h/2);
            const angle = Math.atan2(dy, dx);
            cornerBullets.push({
                x: boss.x + boss.w/2,
                y: boss.y + boss.h/2,
                targetX: corner.x,
                targetY: corner.y,
                vx: Math.cos(angle) * 2.5,
                vy: Math.sin(angle) * 2.5,
                reached: false
            });
        }
        bossSpecialPhase = 1;
    }
    
    // 角から螺旋（サイズ小さめ・速度2.5）
    function fireSpiralFromCorner(cx, cy) {
        const angleToPlayer = Math.atan2(player.y - cy, player.x - cx);
        const spread = 0.5;
        for (let i = -2; i <= 2; i++) {
            const angle = angleToPlayer + i * spread / 2;
            const vx = Math.cos(angle) * 2.5;
            const vy = Math.sin(angle) * 2.5;
            enemyBullets.push({ x: cx, y: cy, vx: vx, vy: vy, life: 300, size: 5, color: '#ff88ff' });
        }
    }
    
    function advanceToNextStage() {
        if (currentStage < 3) {
            currentStage++;
            boss = null;
            bossPhase = 0;
            enemies = [];
            enemyBullets = [];
            playerBullets = [];
            gameTimer = 0;
            stageStartTime = performance.now() / 1000;
            enemySpawnTimer = 10;
        } else {
            gameClear = true;
            gameOver = true;
        }
    }
    
    function update() {
        if (gameOver) return;
        
        const now = performance.now() / 1000;
        const elapsed = now - stageStartTime;
        gameTimer = elapsed;
        
        // ボス出現
        if (!boss && bossPhase === 0 && !gameOver && !gameClear && gameTimer > 15 && currentStage <= 3) {
            if (enemies.length === 0) {
                spawnBoss();
            }
        }
        
        // タッチ移動
        if (isTouching && touchMoveTargetX !== null) {
            const targetX = Math.min(LOGIC_WIDTH - 20, Math.max(20, touchMoveTargetX));
            player.x += (targetX - player.x) * 0.3;
        }
        
        if (shotCooldown <= 0) { shoot(); shotCooldown = 8; }
        else { shotCooldown--; }
        
        // 雑魚
        if (!boss && gameTimer < 15 && !gameOver && !gameClear) {
            if (enemySpawnTimer <= 0) {
                spawnEnemy();
                enemySpawnTimer = 20 + Math.random() * 20;
            } else {
                enemySpawnTimer--;
            }
        }
        
        // 雑魚処理
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            e.y += 2.2;
            if (e.y > LOGIC_HEIGHT + 50) { enemies.splice(i,1); i--; continue; }
            if (e.shotTimer <= 0) {
                enemyBullets.push({ x: e.x + 16, y: e.y + 16, vx: 0, vy: 4.5, size: 6, color: '#ff6666' });
                e.shotTimer = 40;
            } else { e.shotTimer--; }
            
            const dx = player.x - (e.x + 16);
            const dy = player.y - (e.y + 16);
            if (Math.hypot(dx, dy) < player.radius + 16 && invincibleFrames <= 0) {
                playerLives--; updateUI();
                if (playerLives <= 0) { gameOver = true; updateUI(); return; }
                invincibleFrames = 60;
                enemies.splice(i,1); i--;
            }
        }
        
        if (invincibleFrames > 0) invincibleFrames--;
        
        // 自機弾
        for (let i = 0; i < playerBullets.length; i++) {
            playerBullets[i].x += playerBullets[i].vx;
            playerBullets[i].y += playerBullets[i].vy;
            if (playerBullets[i].y < -50) { playerBullets.splice(i,1); i--; }
        }
        
        // 敵弾
        for (let i = 0; i < enemyBullets.length; i++) {
            const eb = enemyBullets[i];
            eb.x += eb.vx;
            eb.y += eb.vy;
            if (eb.life) eb.life--;
            if (eb.y > LOGIC_HEIGHT + 100 || eb.x < -100 || eb.x > LOGIC_WIDTH+100 || (eb.life && eb.life <= 0)) {
                enemyBullets.splice(i,1); i--; continue;
            }
            const dx = player.x - eb.x;
            const dy = player.y - eb.y;
            const hitRadius = eb.size || 6;
            if (Math.hypot(dx, dy) < player.radius + hitRadius && invincibleFrames <= 0) {
                playerLives--; updateUI();
                if (playerLives <= 0) { gameOver = true; updateUI(); return; }
                invincibleFrames = 60;
                enemyBullets.splice(i,1); i--;
            }
        }
        
        // 雑魚と自機弾
        for (let i = 0; i < playerBullets.length; i++) {
            const b = playerBullets[i];
            for (let j = 0; j < enemies.length; j++) {
                const e = enemies[j];
                if (b.x < e.x+e.w && b.x+10 > e.x && b.y < e.y+e.h && b.y+10 > e.y) {
                    enemies.splice(j,1);
                    playerBullets.splice(i,1);
                    score += 100;
                    updateUI();
                    break;
                }
            }
        }
        
        // ===== ボス処理 =====
        if (boss && bossPhase === 1) {
            // 登場
            if (boss.y < boss.targetY) {
                boss.y += 1.5;
                if (boss.y >= boss.targetY) {
                    boss.y = boss.targetY;
                    if (currentStage === 3 && bossSpecialPhase === 0) {
                        setTimeout(() => fireCornerShots(), 300);
                    }
                }
            }
            
            // 移動
            if (currentStage !== 3 || bossSpecialPhase >= 1) {
                boss.x += boss.moveDir * boss.speed;
                if (boss.x <= 20) boss.moveDir = 1;
                if (boss.x >= LOGIC_WIDTH - boss.w - 20) boss.moveDir = -1;
            }
            
            // ---- 3面ボス特別弾幕 ----
            if (currentStage === 3) {
                if (bossSpecialPhase === 1) {
                    let allReached = true;
                    for (let cb of cornerBullets) {
                        if (!cb.reached) {
                            cb.x += cb.vx;
                            cb.y += cb.vy;
                            if (Math.hypot(cb.x - cb.targetX, cb.y - cb.targetY) < 8) cb.reached = true;
                            allReached = false;
                        }
                    }
                    if (allReached) {
                        bossSpecialPhase = 2;
                        spiralTimer = 0;
                    }
                }
                else if (bossSpecialPhase === 2) {
                    // 1面ボスの弾幕（大きめ・速度2）
                    if (boss.shootTimer <= 0) {
                        stage1BossShoot();
                        boss.shootTimer = 20;
                    } else {
                        boss.shootTimer--;
                    }
                    
                    // 角からの螺旋（小さめ）
                    if (spiralTimer % 15 === 0) {
                        for (let cb of cornerBullets) {
                            if (cb.reached) fireSpiralFromCorner(cb.targetX, cb.targetY);
                        }
                    }
                    spiralTimer++;
                }
            }
            // ---- 1,2面ボス弾幕 ----
            else {
                if (boss.shootTimer <= 0) {
                    normalBossShoot();
                    boss.shootTimer = boss.shootDelay;
                } else {
                    boss.shootTimer--;
                }
            }
            
            // 自機弾とボスの衝突
            for (let i = 0; i < playerBullets.length; i++) {
                const b = playerBullets[i];
                const bossCenterX = boss.x + boss.w/2;
                const bossCenterY = boss.y + boss.h/2;
                if (Math.hypot(b.x - bossCenterX, b.y - bossCenterY) < boss.w/2 + 6) {
                    playerBullets.splice(i,1);
                    bossHits++;
                    i--;
                    if (bossHits >= bossMaxHits) {
                        score += 1000;
                        updateUI();
                        advanceToNextStage();
                        return;
                    }
                }
            }
            
            // ボスと自機の衝突
            const bossCenterX = boss.x + boss.w/2;
            const bossCenterY = boss.y + boss.h/2;
            if (Math.hypot(player.x - bossCenterX, player.y - bossCenterY) < player.radius + boss.w/2 && invincibleFrames <= 0) {
                playerLives--;
                updateUI();
                if (playerLives <= 0) gameOver = true;
                invincibleFrames = 60;
            }
        }
        
        if (playerLives <= 0) gameOver = true;
    }
    
    function draw() {
        ctx.clearRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);
        
        // 星
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 60; i++) {
            ctx.fillRect((i*131)%LOGIC_WIDTH, (Date.now()*0.1 + i*73)%LOGIC_HEIGHT, 1, 1);
        }
        
        // 自機
        ctx.fillStyle = '#4cf';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 12);
        ctx.lineTo(player.x - 10, player.y + 4);
        ctx.lineTo(player.x - 4, player.y + 4);
        ctx.lineTo(player.x - 4, player.y + 10);
        ctx.lineTo(player.x, player.y + 6);
        ctx.lineTo(player.x + 4, player.y + 10);
        ctx.lineTo(player.x + 4, player.y + 4);
        ctx.lineTo(player.x + 10, player.y + 4);
        ctx.fill();
        
        // 当たり判定
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#ff0000';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
        
        // 雑魚
        ctx.fillStyle = '#f66';
        for (let e of enemies) ctx.fillRect(e.x, e.y, 32, 32);
        
        // ボス
        if (boss && bossPhase === 1) {
            ctx.font = '64px "Segoe UI Emoji", "Apple Color Emoji", monospace';
            ctx.fillText(boss.emoji, boss.x, boss.y + 10);
            ctx.font = '12px monospace';
            ctx.fillStyle = '#fff';
            ctx.fillText(`BOSS HP: ${bossMaxHits - bossHits}`, boss.x, boss.y-8);
            const percent = (bossMaxHits - bossHits) / bossMaxHits;
            ctx.fillStyle = '#f00';
            ctx.fillRect(boss.x, boss.y-20, boss.w * percent, 6);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(boss.x, boss.y-20, boss.w, 6);
        }
        
        // 角弾
        for (let cb of cornerBullets) {
            if (!cb.reached) {
                ctx.fillStyle = '#ffaa44';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(cb.x, cb.y, 7, 0, Math.PI*2);
                ctx.fill();
            }
        }
        
        // 自機弾
        for (let b of playerBullets) {
            ctx.fillStyle = b.color || '#88ccff';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size || 5, 0, Math.PI*2);
            ctx.fill();
        }
        
        // 敵弾
        for (let eb of enemyBullets) {
            const grad = ctx.createRadialGradient(eb.x, eb.y, 0, eb.x, eb.y, 8);
            grad.addColorStop(0, eb.color || '#ff6666');
            grad.addColorStop(1, '#cc0000');
            ctx.fillStyle = grad;
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.arc(eb.x, eb.y, eb.size || 6, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
        
        // 無敵
        if (invincibleFrames > 0) {
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius + 10, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
        
        // クリア/ゲームオーバー
        if (gameClear) {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);
            ctx.fillStyle = '#ffaa44';
            ctx.font = 'bold 32px monospace';
            ctx.fillText('GAME CLEAR', LOGIC_WIDTH/2-110, LOGIC_HEIGHT/2-30);
            ctx.fillStyle = '#fff';
            ctx.font = '20px monospace';
            ctx.fillText(`ハイスコア  ${highscore} 点`, LOGIC_WIDTH/2-120, LOGIC_HEIGHT/2+30);
            ctx.font = '14px monospace';
            ctx.fillStyle = '#ffaa66';
            ctx.fillText('RESETボタンで再開', LOGIC_WIDTH/2-90, LOGIC_HEIGHT/2+100);
        } else if (gameOver && !gameClear) {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px monospace';
            ctx.fillText('GAME OVER', LOGIC_WIDTH/2-100, LOGIC_HEIGHT/2);
            ctx.font = '14px monospace';
            ctx.fillStyle = '#ffaa66';
            ctx.fillText('RESETボタンで再開', LOGIC_WIDTH/2-90, LOGIC_HEIGHT/2+50);
        }
        
        // ステージ表示
        if (!boss && !gameOver && !gameClear && gameTimer < 15) {
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px monospace';
            ctx.fillText(`STAGE ${currentStage}`, LOGIC_WIDTH-90, 30);
        }
        if (boss && bossPhase===1 && boss.y >= boss.targetY) {
            ctx.fillStyle = '#ff6666';
            ctx.font = 'bold 16px monospace';
            ctx.fillText(currentStage === 3 ? 'BOSS戦(特殊)' : 'BOSS戦', LOGIC_WIDTH-100, 30);
        }
        
        if (isTouching && !gameOver && !gameClear) {
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = '#88aaff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius + 10, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
    
    function setupTouchControls() {
        const canvasElem = canvas;
        const getCanvasX = (clientX) => {
            const rect = canvasElem.getBoundingClientRect();
            const scaleX = LOGIC_WIDTH / rect.width;
            return (clientX - rect.left) * scaleX;
        };
        
        canvasElem.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isTouching = true;
            touchMoveTargetX = getCanvasX(e.touches[0].clientX);
        });
        canvasElem.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isTouching) touchMoveTargetX = getCanvasX(e.touches[0].clientX);
        });
        canvasElem.addEventListener('touchend', (e) => { e.preventDefault(); isTouching = false; touchMoveTargetX = null; });
        canvasElem.addEventListener('touchcancel', (e) => { e.preventDefault(); isTouching = false; touchMoveTargetX = null; });
        canvasElem.addEventListener('mousedown', (e) => { e.preventDefault(); isTouching = true; touchMoveTargetX = getCanvasX(e.clientX); });
        window.addEventListener('mousemove', (e) => { if (isTouching) touchMoveTargetX = getCanvasX(e.clientX); });
        window.addEventListener('mouseup', () => { isTouching = false; touchMoveTargetX = null; });
        
        document.getElementById('resetBtn').addEventListener('click', () => resetGame());
        document.getElementById('resetBtn').addEventListener('touchstart', (e) => { e.preventDefault(); resetGame(); });
    }
    
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    resetGame();
    setupTouchControls();
    gameLoop();
</script>
</body>
</html>
