<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tools_A アカウント商品管理</title>
  <style>
    :root{
      --primary:#1da1f2;
      --primary-dark:#0d8bd9;
      --accent:#ff4444;
      --success:#06c755;
      --bg:#15202b;
      --surface:#1e2a38;
      --surface-soft:#192734;
      --text:#e7e9ea;
      --muted:#91a1af;
      --border:#2d3a48;
      --danger:#e74c3c;
      --radius:14px;
      --shadow:0 8px 24px rgba(0,0,0,.22);
      --content-width:1280px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:radial-gradient(circle at top,rgba(29,161,242,.08),transparent 440px),var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      line-height:1.6;
    }
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    img{display:block;max-width:100%}
    .site-header{
      background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .header-inner{
      width:min(var(--content-width),calc(100% - 32px));
      margin:0 auto;
      padding:18px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{
      width:42px;height:42px;border-radius:9px;
      display:grid;place-items:center;
      background:var(--primary);
      font-weight:800;
    }
    .brand h1{margin:0;font-size:25px}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
    .preview-link{
      color:var(--primary);
      border:1px solid var(--border);
      background:var(--surface-soft);
      border-radius:999px;
      padding:8px 14px;
      font-weight:700;
      text-decoration:none;
    }
    .main{
      width:min(var(--content-width),calc(100% - 32px));
      margin:24px auto 60px;
    }
    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      margin-bottom:16px;
    }
    .toolbar h2{margin:0;font-size:24px}
    .toolbar-actions{display:flex;gap:10px;flex-wrap:wrap}
    .button{
      min-height:42px;
      border:1px solid var(--border);
      border-radius:10px;
      padding:9px 15px;
      background:var(--surface);
      color:var(--text);
      font-weight:800;
    }
    .button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .button.success{background:var(--success);border-color:var(--success);color:#fff}
    .button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
    .button:hover{filter:brightness(.95)}
    .category-bar{
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding:2px 2px 14px;
      margin-bottom:10px;
    }
    .category-card{
      min-width:155px;
      min-height:68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--surface);
      padding:10px;
    }
    .category-card.active{
      border-color:var(--primary);
      background:rgba(29,161,242,.16);
    }
    .category-main{
      min-width:0;
      display:flex;
      align-items:center;
      gap:9px;
      border:0;
      background:transparent;
      color:var(--text);
      padding:0;
      flex:1;
      text-align:left;
    }
    .game-icon{
      width:40px;height:40px;border-radius:50%;
      display:grid;place-items:center;
      background:var(--surface-soft);
      border:1px solid var(--border);
      color:var(--primary);
      font-weight:800;
      flex:0 0 auto;
      overflow:hidden;
    }
    .game-icon img{width:100%;height:100%;object-fit:cover}
    .game-name{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-weight:800;
    }
    .edit-title-button{
      width:32px;height:32px;
      border-radius:8px;
      border:1px solid var(--border);
      background:var(--surface-soft);
      color:var(--muted);
    }
    .workspace{
      display:grid;
      grid-template-columns:minmax(0,1fr) 390px;
      gap:18px;
      align-items:start;
    }
    .product-panel,.editor-panel{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .panel-head{
      padding:16px 18px;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }
    .panel-head h3{margin:0;font-size:19px}
    .panel-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .product-grid{
      padding:16px;
      display:grid;
      gap:12px;
    }
    .product-card{
      display:grid;
      grid-template-columns:112px minmax(0,1fr) auto;
      gap:14px;
      align-items:center;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--surface-soft);
      padding:12px;
    }
    .product-thumb{
      width:112px;height:112px;border-radius:9px;
      background:#203448;
      overflow:hidden;
      border:1px solid var(--border);
    }
    .product-thumb img{width:100%;height:100%;object-fit:cover}
    .product-copy{min-width:0}
    .product-copy h4{
      margin:0 0 6px;
      color:var(--primary);
      font-size:18px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .product-copy p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .product-price{
      margin-top:8px;
      color:var(--accent);
      font-size:22px;
      font-weight:800;
    }
    .edit-product-button{
      min-width:78px;
      min-height:42px;
      border-radius:999px;
      border:1px solid var(--primary);
      color:#fff;
      background:var(--primary);
      font-weight:800;
    }
    .floating-add{
      position:sticky;
      bottom:18px;
      display:flex;
      justify-content:flex-end;
      padding:0 18px 18px;
    }
    .floating-add .button{
      box-shadow:0 8px 24px rgba(0,0,0,.32);
      border-radius:999px;
      min-height:50px;
      padding-inline:20px;
    }
    .editor-panel{
      position:sticky;
      top:16px;
      overflow:hidden;
    }
    .editor-body{padding:18px}
    .editor-mode{
      display:inline-flex;
      margin-bottom:14px;
      padding:5px 9px;
      border-radius:999px;
      background:rgba(29,161,242,.14);
      color:var(--primary);
      font-size:12px;
      font-weight:800;
    }
    .field{margin-bottom:14px}
    .field label{
      display:block;
      margin-bottom:6px;
      font-size:13px;
      font-weight:800;
    }
    .field input,.field textarea,.field select{
      width:100%;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--surface-soft);
      color:var(--text);
      padding:10px 12px;
      outline:none;
    }
    .field input:focus,.field textarea:focus,.field select:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(29,161,242,.12);
    }
    .field textarea{min-height:112px;resize:vertical}
    .drop-zone{
      min-height:142px;
      border:2px dashed var(--border);
      border-radius:12px;
      background:var(--surface-soft);
      display:grid;
      place-items:center;
      text-align:center;
      color:var(--muted);
      padding:16px;
      transition:.2s;
    }
    .drop-zone.dragover{
      border-color:var(--primary);
      background:rgba(29,161,242,.08);
    }
    .image-preview-list{
      margin-top:10px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }
    .preview-item{
      position:relative;
      aspect-ratio:1/1;
      border-radius:8px;
      overflow:hidden;
      border:1px solid var(--border);
      background:#203448;
    }
    .preview-item img{width:100%;height:100%;object-fit:cover}
    .preview-item button{
      position:absolute;
      right:4px;top:4px;
      width:24px;height:24px;
      border:0;border-radius:50%;
      background:rgba(0,0,0,.68);
      color:#fff;
    }
    .preview-order{
      position:absolute;
      left:4px;
      bottom:4px;
      min-width:24px;
      height:24px;
      padding:0 6px;
      border-radius:999px;
      display:grid;
      place-items:center;
      background:rgba(0,0,0,.72);
      color:#fff;
      font-size:11px;
      font-weight:800;
    }
    .editor-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:18px;
    }
    .editor-actions .button.primary{grid-column:1/-1}
    dialog{
      width:min(460px,calc(100% - 28px));
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      padding:0;
      box-shadow:var(--shadow);
    }
    dialog::backdrop{background:rgba(0,0,0,.72)}
    .dialog-head{
      padding:16px 18px;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .dialog-head h3{margin:0}
    .dialog-close{
      width:34px;height:34px;border:0;border-radius:50%;
      background:var(--surface-soft);color:var(--text)
    }
    .dialog-body{padding:18px}
    .dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
    .icon-upload{
      display:grid;
      grid-template-columns:88px 1fr;
      gap:12px;
      align-items:center;
    }
    .icon-preview{
      width:88px;height:88px;border-radius:50%;
      background:var(--surface-soft);
      border:1px solid var(--border);
      display:grid;place-items:center;
      color:var(--primary);
      overflow:hidden;
      font-weight:800;
    }
    .icon-preview img{width:100%;height:100%;object-fit:cover}
    .notice{
      display:none;
      position:fixed;
      left:50%;bottom:24px;
      transform:translateX(-50%);
      background:#0f1720;
      border:1px solid var(--border);
      color:#fff;
      border-radius:999px;
      padding:10px 18px;
      z-index:20;
      box-shadow:var(--shadow);
    }
    .notice.show{display:block}
    @media(max-width:900px){
      .workspace{grid-template-columns:1fr}
      .editor-panel{position:static}
    }
    @media(max-width:600px){
      .header-inner,.main{width:min(100% - 14px,var(--content-width))}
      .header-inner{align-items:flex-start}
      .brand h1{font-size:19px}
      .brand p,.preview-link{display:none}
      .toolbar{align-items:flex-start;flex-direction:column}
      .category-card{min-width:138px}
      .product-card{grid-template-columns:88px minmax(0,1fr)}
      .product-thumb{width:88px;height:88px}
      .edit-product-button{
        grid-column:1/-1;
        width:100%;
      }
      .image-preview-list{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <h1>アカウント商品管理</h1>
          <p>ゲームタイトル・商品・画像を編集する管理画面ひな型</p>
        </div>
      </div>
      <a class="preview-link" href="#" onclick="return false;">公開ページを確認</a>
    </div>
  </header>

  <main class="main">
    <div class="toolbar">
      <h2>ゲームタイトル・商品管理</h2>
      <div class="toolbar-actions">
        <button class="button" id="addGameButton" type="button">＋ 新規タイトル枠追加</button>
        <button class="button" id="editGameButton" type="button">✎ タイトル編集</button>
      </div>
    </div>

    <section class="category-bar" id="categoryBar"></section>

    <div class="workspace">
      <section class="product-panel">
        <div class="panel-head">
          <div>
            <h3 id="selectedGameHeading">モンストの商品</h3>
            <p>商品枠の編集ボタンから内容を変更できます</p>
          </div>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <div class="floating-add">
          <button class="button primary" id="addProductButton" type="button">＋ このタイトルに新規商品を追加</button>
        </div>
      </section>

      <aside class="editor-panel">
        <div class="panel-head">
          <div>
            <h3>商品編集</h3>
            <p>必要項目を入力して決定してください</p>
          </div>
        </div>

        <div class="editor-body">
          <span class="editor-mode" id="editorMode">新規商品</span>

          <div class="field">
            <label for="productGame">ゲームタイトル</label>
            <select id="productGame"></select>
          </div>

          <div class="field">
            <label for="productTitle">商品タイトル</label>
            <input id="productTitle" type="text" placeholder="例：限定キャラ多数・オーブ4,417個">
          </div>

          <div class="field">
            <label for="productDescription">商品説明</label>
            <textarea id="productDescription" placeholder="所持内容や商品の特徴を入力"></textarea>
          </div>

          <div class="field">
            <label for="productPrice">金額</label>
            <input id="productPrice" type="number" min="0" step="1" placeholder="7500">
          </div>

          <div class="field">
            <label>商品画像</label>
            <div class="drop-zone" id="dropZone">
              <div>
                <strong>画像をここへドラッグ＆ドロップ</strong><br>
                <small>またはクリックして複数画像を選択</small>
              </div>
            </div>
            <input id="imageInput" type="file" accept="image/*" multiple hidden>
            <div class="image-preview-list" id="imagePreviewList"></div>
          </div>

          <div class="editor-actions">
            <button class="button" id="clearButton" type="button">入力をクリア</button>
            <button class="button danger" id="deleteButton" type="button">商品を削除</button>
            <button class="button primary" id="saveButton" type="button">決定して出品完了</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <dialog id="gameDialog">
    <div class="dialog-head">
      <h3 id="gameDialogTitle">新規タイトル枠追加</h3>
      <button class="dialog-close" type="button" data-close-dialog>×</button>
    </div>
    <div class="dialog-body">
      <div class="field">
        <label for="gameOfficialName">正式タイトル</label>
        <input id="gameOfficialName" type="text" placeholder="モンスターストライク">
      </div>
      <div class="field">
        <label for="gameShortName">通称</label>
        <input id="gameShortName" type="text" placeholder="モンスト">
      </div>
      <div class="field">
        <label>ゲームアイコン</label>
        <div class="icon-upload">
          <div class="icon-preview" id="iconPreview">画像</div>
          <input id="gameIconInput" type="file" accept="image/*">
        </div>
      </div>
      <div class="dialog-actions">
        <button class="button" type="button" data-close-dialog>キャンセル</button>
        <button class="button primary" id="saveGameButton" type="button">決定</button>
      </div>
    </div>
  </dialog>

  <div class="notice" id="notice">保存しました</div>

  <script>
    const API_BASE = "http://127.0.0.1:8765";

    const state = {
      selectedGameId: null,
      editingProductId: null,
      editingGameId: null,
      productImages: [],
      pendingProductFiles: [],
      pendingGameIconFile: null,
      games: [],
      products: []
    };

    const categoryBar = document.getElementById("categoryBar");
    const productGrid = document.getElementById("productGrid");
    const selectedGameHeading = document.getElementById("selectedGameHeading");
    const productGame = document.getElementById("productGame");
    const productTitle = document.getElementById("productTitle");
    const productDescription = document.getElementById("productDescription");
    const productPrice = document.getElementById("productPrice");
    const imageInput = document.getElementById("imageInput");
    const dropZone = document.getElementById("dropZone");
    const imagePreviewList = document.getElementById("imagePreviewList");
    const editorMode = document.getElementById("editorMode");
    const deleteButton = document.getElementById("deleteButton");
    const saveButton = document.getElementById("saveButton");
    const saveGameButton = document.getElementById("saveGameButton");
    const gameDialog = document.getElementById("gameDialog");
    const notice = document.getElementById("notice");

    function formatPrice(value) {
      return new Intl.NumberFormat("ja-JP", {
        style: "currency",
        currency: "JPY",
        maximumFractionDigits: 0
      }).format(Number(value || 0));
    }

    function placeholderImage(label) {
      const safeLabel = String(label || "NO IMAGE").replace(/[<>&"']/g, "");
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">
          <rect width="500" height="500" fill="#203448"/>
          <circle cx="250" cy="200" r="85" fill="none" stroke="#55b9fa" stroke-width="10"/>
          <path d="M180 200h140M250 130v140" stroke="#55b9fa" stroke-width="18" stroke-linecap="round"/>
          <text x="250" y="350" text-anchor="middle" fill="#55b9fa" font-family="Arial" font-size="34" font-weight="700">${safeLabel}</text>
        </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    function selectedGame() {
      return state.games.find(game => game.id === state.selectedGameId) || null;
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.classList.add("show");
      clearTimeout(showNotice.timer);
      showNotice.timer = setTimeout(() => notice.classList.remove("show"), 2600);
    }

    async function apiJson(path, options = {}) {
      const response = await fetch(API_BASE + path, {
        cache: "no-store",
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error("APIの応答を読み取れませんでした");
      }

      if (!response.ok || !data.ok) {
        throw new Error(data.error || "API処理に失敗しました");
      }
      return data;
    }

    async function loadData() {
      try {
        showNotice("データを読み込んでいます");
        const data = await apiJson("/api/account/load");
        state.games = Array.isArray(data.games) ? data.games : [];
        state.products = Array.isArray(data.accounts) ? data.accounts : [];

        if (!state.games.some(game => game.id === state.selectedGameId)) {
          state.selectedGameId = state.games[0]?.id || null;
        }

        renderAll();
        clearEditor();
        showNotice("読み込みました");
      } catch (error) {
        console.error(error);
        renderAll();
        clearEditor();
        showNotice("読込エラー: " + error.message);
      }
    }

    async function saveAllData() {
      return apiJson("/api/account/save", {
        method: "POST",
        body: JSON.stringify({
          games: state.games,
          accounts: state.products
        })
      });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          const comma = result.indexOf(",");
          if (comma < 0) {
            reject(new Error("画像データを変換できませんでした"));
            return;
          }
          resolve(result.slice(comma + 1));
        };
        reader.onerror = () => reject(new Error("画像を読み込めませんでした"));
        reader.readAsDataURL(file);
      });
    }

    function safeUploadName(file, prefix) {
      const original = file.name || "image.png";
      const dot = original.lastIndexOf(".");
      const ext = dot >= 0 ? original.slice(dot).toLowerCase() : ".png";
      const safeExt = [".png", ".jpg", ".jpeg", ".webp"].includes(ext) ? ext : ".png";
      return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 9)}${safeExt}`;
    }

    async function uploadImage(file, type, prefix) {
      const contentBase64 = await fileToBase64(file);
      return apiJson("/api/account/upload", {
        method: "POST",
        body: JSON.stringify({
          filename: safeUploadName(file, prefix),
          content_base64: contentBase64,
          type
        })
      });
    }

    function renderGames() {
      if (!state.games.length) {
        categoryBar.innerHTML = `<p style="color:var(--muted);padding:14px">タイトルがありません。「新規タイトル枠追加」から登録してください。</p>`;
        productGame.innerHTML = "";
        return;
      }

      categoryBar.innerHTML = state.games.map(game => `
        <div class="category-card ${game.id === state.selectedGameId ? "active" : ""}">
          <button class="category-main" type="button" data-game-id="${game.id}">
            <span class="game-icon">
              ${game.icon ? `<img src="${game.icon}" alt="">` : String(game.shortName || "?").slice(0,1)}
            </span>
            <span class="game-name">${game.shortName}</span>
          </button>
          <button class="edit-title-button" type="button" data-edit-game="${game.id}" aria-label="${game.shortName}を編集">✎</button>
        </div>
      `).join("");

      categoryBar.querySelectorAll("[data-game-id]").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedGameId = button.dataset.gameId;
          renderAll();
          startNewProduct();
        });
      });

      categoryBar.querySelectorAll("[data-edit-game]").forEach(button => {
        button.addEventListener("click", () => openGameDialog(button.dataset.editGame));
      });

      productGame.innerHTML = state.games.map(game =>
        `<option value="${game.id}">${game.shortName}</option>`
      ).join("");

      productGame.value = state.selectedGameId || state.games[0].id;
    }

    function renderProducts() {
      const game = selectedGame();

      if (!game) {
        selectedGameHeading.textContent = "商品";
        productGrid.innerHTML = `<p style="color:var(--muted);padding:20px">先にゲームタイトルを登録してください。</p>`;
        return;
      }

      selectedGameHeading.textContent = `${game.shortName}の商品`;
      const visible = state.products.filter(product => product.gameId === state.selectedGameId);

      productGrid.innerHTML = visible.length ? visible.map(product => `
        <article class="product-card">
          <div class="product-thumb">
            <img src="${product.images?.[0] || placeholderImage(game.shortName)}" alt="${product.title}">
          </div>
          <div class="product-copy">
            <h4>${product.title}</h4>
            <p>${product.description}</p>
            <div class="product-price">${formatPrice(product.price)}</div>
          </div>
          <button class="edit-product-button" type="button" data-edit-product="${product.id}">編集</button>
        </article>
      `).join("") : `<p style="color:var(--muted);padding:20px">このタイトルの商品はまだありません。</p>`;

      productGrid.querySelectorAll("[data-edit-product]").forEach(button => {
        button.addEventListener("click", () => editProduct(button.dataset.editProduct));
      });
    }

    function renderImagePreviews() {
      const previews = [
        ...state.productImages.map(src => ({ src, existing: true })),
        ...state.pendingProductFiles.map(item => ({ src: item.preview, existing: false }))
      ];

      imagePreviewList.innerHTML = previews.map((item, index) => `
        <div class="preview-item">
          <img src="${item.src}" alt="商品画像${index + 1}">
          <span class="preview-order">${index + 1}</span>
          <button type="button" data-remove-image="${index}" aria-label="画像${index + 1}を削除">×</button>
        </div>
      `).join("");

      imagePreviewList.querySelectorAll("[data-remove-image]").forEach(button => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.removeImage);
          if (index < state.productImages.length) {
            state.productImages.splice(index, 1);
          } else {
            state.pendingProductFiles.splice(index - state.productImages.length, 1);
          }
          renderImagePreviews();
        });
      });
    }

    function renderAll() {
      renderGames();
      renderProducts();
    }

    function clearEditor() {
      state.editingProductId = null;
      state.productImages = [];
      state.pendingProductFiles = [];
      productGame.value = state.selectedGameId || "";
      productTitle.value = "";
      productDescription.value = "";
      productPrice.value = "";
      imageInput.value = "";
      editorMode.textContent = "新規商品";
      deleteButton.style.visibility = "hidden";
      renderImagePreviews();
    }

    function startNewProduct() {
      if (!state.games.length) {
        showNotice("先にゲームタイトルを追加してください");
        return;
      }
      clearEditor();
      productGame.value = state.selectedGameId;
      productTitle.focus();
    }

    function editProduct(id) {
      const product = state.products.find(item => item.id === id);
      if (!product) return;

      state.editingProductId = id;
      state.productImages = Array.isArray(product.images) ? [...product.images] : [];
      state.pendingProductFiles = [];
      productGame.value = product.gameId;
      productTitle.value = product.title;
      productDescription.value = product.description;
      productPrice.value = product.price;
      editorMode.textContent = "商品編集中";
      deleteButton.style.visibility = "visible";
      renderImagePreviews();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function saveProduct() {
      const title = productTitle.value.trim();
      const description = productDescription.value.trim();
      const price = Number(productPrice.value);
      const gameId = productGame.value;

      if (!gameId) {
        showNotice("ゲームタイトルを選択してください");
        return;
      }
      if (!title || !description || !Number.isFinite(price) || price < 0) {
        showNotice("タイトル・説明・金額を入力してください");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "保存中…";

      try {
        const uploadedPaths = [];
        for (const item of state.pendingProductFiles) {
          const uploaded = await uploadImage(item.file, "product", gameId);
          uploadedPaths.push(uploaded.path);
        }

        const data = {
          gameId,
          title,
          description,
          price,
          images: [...state.productImages, ...uploadedPaths]
        };

        if (state.editingProductId) {
          const index = state.products.findIndex(item => item.id === state.editingProductId);
          if (index < 0) throw new Error("編集対象の商品が見つかりません");
          state.products[index] = { ...state.products[index], ...data };
        } else {
          state.products.push({
            id: `${gameId}-${Date.now()}`,
            ...data
          });
        }

        await saveAllData();
        state.selectedGameId = gameId;
        renderAll();
        clearEditor();
        showNotice("商品を保存しました");
      } catch (error) {
        console.error(error);
        showNotice("保存エラー: " + error.message);
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "決定して出品完了";
      }
    }

    async function deleteProduct() {
      if (!state.editingProductId) return;
      if (!confirm("この商品を削除しますか？")) return;

      const previous = [...state.products];
      state.products = state.products.filter(item => item.id !== state.editingProductId);

      try {
        await saveAllData();
        renderProducts();
        clearEditor();
        showNotice("商品を削除しました");
      } catch (error) {
        state.products = previous;
        renderProducts();
        showNotice("削除エラー: " + error.message);
      }
    }

    function addFiles(files) {
      [...files].forEach(file => {
        if (!file.type.startsWith("image/")) return;
        const preview = URL.createObjectURL(file);
        state.pendingProductFiles.push({ file, preview });
      });
      imageInput.value = "";
      renderImagePreviews();
    }

    function openGameDialog(gameId = null) {
      state.editingGameId = gameId;
      state.pendingGameIconFile = null;
      const game = state.games.find(item => item.id === gameId);

      document.getElementById("gameDialogTitle").textContent = game ? "タイトル編集" : "新規タイトル枠追加";
      document.getElementById("gameOfficialName").value = game?.officialName || "";
      document.getElementById("gameShortName").value = game?.shortName || "";
      document.getElementById("gameIconInput").value = "";

      const preview = document.getElementById("iconPreview");
      preview.innerHTML = game?.icon ? `<img src="${game.icon}" alt="">` : "画像";
      gameDialog.showModal();
    }

    async function saveGame() {
      const officialName = document.getElementById("gameOfficialName").value.trim();
      const shortName = document.getElementById("gameShortName").value.trim();

      if (!officialName || !shortName) {
        showNotice("正式タイトルと通称を入力してください");
        return;
      }

      saveGameButton.disabled = true;
      saveGameButton.textContent = "保存中…";

      try {
        let icon = "";
        const existingGame = state.games.find(item => item.id === state.editingGameId);
        if (existingGame?.icon) icon = existingGame.icon;

        if (state.pendingGameIconFile) {
          const prefix = state.editingGameId || "game";
          const uploaded = await uploadImage(state.pendingGameIconFile, "icon", prefix);
          icon = uploaded.path;
        }

        if (state.editingGameId) {
          const index = state.games.findIndex(item => item.id === state.editingGameId);
          if (index < 0) throw new Error("編集対象のタイトルが見つかりません");
          state.games[index] = { ...state.games[index], officialName, shortName, icon };
        } else {
          const id = `game-${Date.now()}`;
          state.games.push({ id, officialName, shortName, icon });
          state.selectedGameId = id;
        }

        await saveAllData();
        gameDialog.close();
        renderAll();
        clearEditor();
        showNotice("ゲームタイトルを保存しました");
      } catch (error) {
        console.error(error);
        showNotice("保存エラー: " + error.message);
      } finally {
        saveGameButton.disabled = false;
        saveGameButton.textContent = "決定";
      }
    }

    document.getElementById("addGameButton").addEventListener("click", () => openGameDialog());
    document.getElementById("editGameButton").addEventListener("click", () => {
      if (!state.selectedGameId) {
        showNotice("編集するタイトルがありません");
        return;
      }
      openGameDialog(state.selectedGameId);
    });
    document.getElementById("addProductButton").addEventListener("click", startNewProduct);
    saveButton.addEventListener("click", saveProduct);
    document.getElementById("clearButton").addEventListener("click", clearEditor);
    deleteButton.addEventListener("click", deleteProduct);
    saveGameButton.addEventListener("click", saveGame);

    document.querySelectorAll("[data-close-dialog]").forEach(button => {
      button.addEventListener("click", () => gameDialog.close());
    });

    dropZone.addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", event => addFiles(event.target.files));
    dropZone.addEventListener("dragover", event => {
      event.preventDefault();
      dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", event => {
      event.preventDefault();
      dropZone.classList.remove("dragover");
      addFiles(event.dataTransfer.files);
    });

    document.getElementById("gameIconInput").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file || !file.type.startsWith("image/")) return;

      state.pendingGameIconFile = file;
      const previewUrl = URL.createObjectURL(file);
      document.getElementById("iconPreview").innerHTML = `<img src="${previewUrl}" alt="">`;
    });

    loadData();
  </script>
</body>
</html>
